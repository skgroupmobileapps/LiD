<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Play Feature Graphic – Leben in Deutschland</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #131313;
      -webkit-font-smoothing: antialiased;
    }

    .mat-icon {
      font-family: 'Material Symbols Outlined';
      font-style: normal;
      font-weight: normal;
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }

    /* ── Canvas ── */
    .canvas {
      width: 1024px;
      height: 500px;
      background: #131313;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    /* ── Ambient glows ── */
    .glow-tl {
      position: absolute;
      top: -200px; left: -140px;
      width: 620px; height: 620px;
      background: radial-gradient(circle, rgba(136,217,130,0.13) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }
    .glow-br {
      position: absolute;
      bottom: -160px; right: 120px;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(248,189,42,0.07) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }
    .glow-phones {
      position: absolute;
      left: 510px; top: 0;
      width: 514px; height: 500px;
      background: radial-gradient(ellipse at 40% 55%, rgba(136,217,130,0.07) 0%, transparent 58%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── German flag stripe (left edge) ── */
    .flag {
      position: absolute;
      left: 0; top: 0;
      width: 5px; height: 500px;
      display: flex; flex-direction: column;
      z-index: 20;
    }
    .flag .f1 { flex: 1; background: #141414; }
    .flag .f2 { flex: 1; background: #BB0000; }
    .flag .f3 { flex: 1; background: #F8BD2A; }

    /* ── Vertical divider ── */
    .divider {
      position: absolute;
      left: 534px; top: 64px;
      width: 1px; height: 372px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(255,255,255,0.07) 22%,
        rgba(255,255,255,0.07) 78%,
        transparent 100%);
      z-index: 5;
    }

    /* ── Left content ── */
    .left {
      width: 534px;
      flex-shrink: 0;
      padding-left: 46px;
      padding-right: 24px;
      position: relative;
      z-index: 5;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(136,217,130,0.09);
      border: 1px solid rgba(136,217,130,0.24);
      border-radius: 9999px;
      padding: 5px 14px;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #88d982;
      flex-shrink: 0;
    }
    .badge-text {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #88d982;
      text-transform: uppercase;
    }

    /* Headline */
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1.07;
      letter-spacing: -0.03em;
      color: #e5e2e1;
      margin-bottom: 16px;
    }
    h1 .green { color: #88d982; }

    /* Subtitle */
    .subtitle {
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
      color: #bfcaba;
      margin-bottom: 26px;
      max-width: 380px;
    }

    /* Feature pills */
    .features { display: flex; gap: 8px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1c1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 7px 12px;
    }
    .pill .mat-icon { font-size: 15px; }
    .pill .pill-label {
      font-family: 'Manrope', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #e5e2e1;
    }
    .pill.green .mat-icon { color: #88d982; }
    .pill.gold  .mat-icon { color: #f8bd2a; }

    /* ── Phone mockup ── */
    .phone {
      position: absolute;
      border-radius: 30px;
      border: 7px solid #1d1d1d;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 24px 70px rgba(0,0,0,0.75),
        -5px 10px 28px rgba(0,0,0,0.5);
      overflow: hidden;
      background: #0e0e0e;
      z-index: 4;
    }
    .phone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, transparent 42%);
      pointer-events: none;
      z-index: 5;
    }
    .phone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ── Bottom watermark ── */
    .watermark {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }
    .wm-line {
      height: 1px; width: 44px;
      background: rgba(229,226,225,0.12);
    }
    .wm-text {
      font-family: 'Manrope', sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: rgba(229,226,225,0.20);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div class="canvas">

  <!-- Background glows -->
  <div class="glow-tl"></div>
  <div class="glow-br"></div>
  <div class="glow-phones"></div>

  <!-- German flag left stripe -->
  <div class="flag">
    <div class="f1"></div>
    <div class="f2"></div>
    <div class="f3"></div>
  </div>

  <!-- Vertical divider -->
  <div class="divider"></div>

  <!-- ── Left: Copy ── -->
  <div class="left">

    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Einbürgerungstest 2026</span>
    </div>

    <h1>
      Your Path to<br>
      <span class="green">German Citizenship</span>
    </h1>

    <p class="subtitle">
      310+ official questions, full exam simulation,<br>
      and real-time progress tracking — completely free.
    </p>

    <div class="features">
      <div class="pill green">
        <span class="mat-icon">quiz</span>
        <span class="pill-label">310 Questions</span>
      </div>
      <div class="pill gold">
        <span class="mat-icon">model_training</span>
        <span class="pill-label">Exam Simulation</span>
      </div>
      <div class="pill green">
        <span class="mat-icon">check_circle</span>
        <span class="pill-label">Free · No Ads</span>
      </div>
    </div>

  </div>

  <!-- ── Phone 1: Learning Flow (front, left, tilted left) ── -->
  <div class="phone" style="
    width: 188px;
    height: 400px;
    left: 558px;
    top: 50px;
    transform: rotate(-4deg);
    z-index: 4;
  ">
    <img src="screenshots/smooth_learning_flow_marketing_refined/screen.png"
         alt="Learning flow dashboard">
  </div>

  <!-- ── Phone 2: Free & No Ads (behind, right, tilted right) ── -->
  <div class="phone" style="
    width: 172px;
    height: 365px;
    left: 778px;
    top: 68px;
    transform: rotate(3.5deg);
    z-index: 3;
    opacity: 0.9;
  ">
    <img src="screenshots/no_ads_free_marketing_refined/screen.png"
         alt="Free no ads profile screen">
  </div>

  <!-- Bottom watermark -->
  <div class="watermark">
    <div class="wm-line"></div>
    <span class="wm-text">Leben in Deutschland · Einbürgerungstest 2026</span>
    <div class="wm-line"></div>
  </div>

</div>
</body>
</html>
